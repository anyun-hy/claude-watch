[package]
name = "claude-watch-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native Rust command interface for the full Claude Watch migration"

[dependencies]
claude-watch-core = { path = "../watch-core" }
claude-watch-runtime = { path = "../watch-runtime" }
claude-watch-installer = { path = "../watch-installer" }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
claude-watch-system = { path = "../watch-system" }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "ready_entry_fixture"
path = "tests/support/ready_entry_fixture_main.rs"
harness = false
